<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet San Marcos | Detalle de producto</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Vet <span>San Marcos</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <div class="navbar-nav mx-auto">
                        <a class="nav-link" href="index.html">Inicio</a>
                        <a class="nav-link active" href="catalogo.html">Productos</a>
                        <a class="nav-link" href="index.html#quienes-somos">Quiénes somos</a>
                        <a class="nav-link" href="index.html#contacto">Contáctanos</a>
                    </div>
                    <div class="navbar-nav align-items-lg-center" id="zonaSesion">
                        <a class="nav-link" href="login.html">Ingresar</a>
                    </div>
                    <a href="carrito.html" class="btn btn-outline-primary ms-lg-3 mt-2 mt-lg-0 position-relative">
                        🛒 Carrito
                        <span id="contadorCarrito" class="badge bg-danger rounded-pill ms-1">0</span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <a href="catalogo.html" class="btn btn-outline-secondary mb-4">&larr; Volver al catálogo</a>

        <section id="fichaProducto" class="d-none">
            <div class="row g-5">
                <div class="col-lg-5">
                    <img id="imgProducto" class="detalle-img" src="" alt="">
                </div>
                <div class="col-lg-7">
                    <span id="categoriaProducto" class="badge text-bg-secondary mb-2"></span>
                    <h1 id="nombreProducto" class="fw-bold mb-2"></h1>
                    <p id="especieProducto" class="text-secondary"></p>
                    <p id="precioProducto" class="display-6 producto-precio mb-3"></p>
                    <p id="descripcionProducto" class="mb-4"></p>

                    <p id="estadoStock" class="mb-3 fw-semibold"></p>

                    <form id="formAgregarCarrito" class="row g-3 align-items-center">
                        <div class="col-auto">
                            <label for="cantidadProducto" class="form-label">Cantidad</label>
                            <input type="number" id="cantidadProducto" class="form-control" value="1" min="1">
                        </div>
                        <div class="col-auto align-self-end">
                            <button type="submit" id="btnAgregarCarrito" class="btn btn-primary btn-lg">
                                Añadir al carrito
                            </button>
                        </div>
                    </form>
                    <div id="mensajeCarrito" class="alert mt-3 d-none"></div>
                </div>
            </div>
        </section>

        <div id="productoNoEncontrado" class="alert alert-warning d-none">
            No se encontró el producto solicitado.
        </div>
    </main>

    <footer class="py-4 border-top">
        <div class="container text-center equipo-info">
            <p class="mb-1"><strong>Vet San Marcos</strong> · Proyecto académico</p>
            <p class="mb-1">Equipo: Vet San Marcos — Integrantes: Ariel Catalán y Vinc González</p>
            <p class="mb-0">Asignatura: DSY1104 – Desarrollo FullStack II — 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/detalle.js"></script>
</body>
</html>
