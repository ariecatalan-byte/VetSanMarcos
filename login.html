<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet San Marcos | Iniciar sesión</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Vet <span>San Marcos</span></a>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <section class="mb-4 text-center">
                    <div class="display-6">🐾</div>
                    <h1 class="fw-bold mt-2">Iniciar sesión</h1>
                    <p class="text-secondary">Ingresa con tu correo institucional @duoc.cl</p>
                </section>

                <section class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <form id="formLogin" novalidate>
                            <div class="mb-3">
                                <label for="correoLogin" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="correoLogin" required>
                                <div class="mensaje-error d-none" id="errorCorreoLogin"></div>
                            </div>
                            <div class="mb-3">
                                <label for="passwordLogin" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordLogin" required>
                                <div class="mensaje-error d-none" id="errorPasswordLogin"></div>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Iniciar sesión</button>
                            </div>
                        </form>

                        <div id="mensajeLogin" class="alert alert-danger mt-4 d-none"></div>

                        <p class="text-center mt-4 mb-0">
                            ¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-4 border-top">
        <div class="container text-center equipo-info">
            <p class="mb-1"><strong>Vet San Marcos</strong> · Proyecto académico</p>
            <p class="mb-1">Equipo: Vet San Marcos — Integrantes: Ariel Catalán y Vinc González</p>
            <p class="mb-0">Asignatura: DSY1104 – Desarrollo FullStack II — 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
